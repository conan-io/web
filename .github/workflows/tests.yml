name: Tests

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "conanio/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conanio:
    name: conanio (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: conanio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as conanio/Dockerfile (node:25.6.0-alpine)
          node-version: 25
          cache: yarn
          cache-dependency-path: conanio/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:ci
